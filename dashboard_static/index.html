<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karen Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #0a0a0a;
            --card: #1a1a1a;
            --border: #333;
            --accent: #00d4ff;
            --text: #fff;
            --muted: #888;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            line-height: 1.6;
        }
        
        h1 {
            color: var(--accent);
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
        }
        
        .card h2 {
            color: var(--muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        
        .card .value {
            font-size: 2rem;
            color: var(--accent);
            font-weight: bold;
        }
        
        .section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .section h2 {
            color: var(--accent);
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 5px 0 10px;
            background: #252525;
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px;
            font-size: 1rem;
        }
        
        button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
        }
        
        button:hover {
            background: #00a8cc;
        }
        
        .kanban {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .column {
            background: #252525;
            border-radius: 6px;
            padding: 12px;
        }
        
        .column h3 {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        
        .task {
            background: var(--card);
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            border-left: 3px solid var(--accent);
            cursor: pointer;
        }
        
        .task:hover {
            background: #333;
        }
        
        .note {
            background: #252525;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        
        .note .time {
            color: var(--muted);
            font-size: 0.75rem;
        }
        
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .link-btn {
            background: #252525;
            color: var(--text);
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        
        .link-btn:hover {
            border-color: var(--accent);
        }
    </style>
</head>
<body>
    <h1>🦞 Karen Dashboard</h1>
    
    <!-- Time Display -->
    <div class="grid">
        <div class="card">
            <h2>Current Time</h2>
            <div class="value" id="clock">--:--</div>
        </div>
        <div class="card">
            <h2>Date</h2>
            <div class="value" style="font-size: 1.2rem;" id="date">---</div>
        </div>
    </div>
    
    <!-- Quick Links -->
    <div class="section">
        <h2>Quick Links</h2>
        <div class="links">
            <a href="http://localhost:5002" class="link-btn">Dashboard v3</a>
            <a href="http://100.75.72.26:18788" class="link-btn">OpenClaw</a>
            <a href="https://web.telegram.org" class="link-btn">Telegram</a>
            <a href="https://github.com" class="link-btn">GitHub</a>
        </div>
    </div>
    
    <!-- Memory Browser -->
    <div class="section">
        <h2>Memory Browser</h2>
        <div id="memoryList" style="max-height: 300px; overflow-y: auto;">
            <div style="color: var(--muted);">Loading memory files...</div>
        </div>
    </div>
    
    <!-- Research Browser -->
    <div class="section">
        <h2>Research Library</h2>
        <div id="researchList" style="max-height: 300px; overflow-y: auto;">
            <div style="color: var(--muted);">Loading research files...</div>
        </div>
    </div>
    
    <!-- Projects -->
    <div class="section">
        <h2>Projects</h2>
        <div style="margin-bottom: 15px;">
            <input type="text" id="projectInput" placeholder="New project...">
            <button onclick="addProject()">Add</button>
        </div>
        <div class="kanban">
            <div class="column">
                <h3>To Do</h3>
                <div id="todoList"></div>
            </div>
            <div class="column">
                <h3>Doing</h3>
                <div id="doingList"></div>
            </div>
            <div class="column">
                <h3>Done</h3>
                <div id="doneList"></div>
            </div>
        </div>
    </div>
    
    <!-- Quick Notes -->
    <div class="section">
        <h2>Quick Notes</h2>
        <div style="margin-bottom: 15px;">
            <textarea id="noteInput" rows="3" placeholder="Type a note..."></textarea>
            <button onclick="addNote()">Add Note</button>
        </div>
        <div id="notesList"></div>
    </div>
    
    <!-- File Viewer Modal -->
    <div id="fileModal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.9); z-index: 1000; padding: 20px;">
        <div style="background: var(--card); max-width: 900px; margin: 0 auto; border-radius: 8px; max-height: 90vh; display: flex; flex-direction: column;">
            <div style="padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                <h3 id="fileTitle" style="color: var(--accent); margin: 0;">File Viewer</h3>
                <button onclick="closeFile()" style="background: #333; color: #fff;">✕ Close</button>
            </div>
            <pre id="fileContent" style="padding: 20px; overflow-y: auto; flex: 1; white-space: pre-wrap; font-family: monospace; font-size: 0.9rem; line-height: 1.5;">Loading...</pre>
        </div>
    </div>

    <script>
        // Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').textContent = now.toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
            document.getElementById('date').textContent = now.toLocaleDateString('en-GB', {weekday: 'short', day: 'numeric', month: 'short'});
        }
        updateClock();
        setInterval(updateClock, 1000);
        
        // Data storage
        let projects = JSON.parse(localStorage.getItem('projects') || '[]');
        let notes = JSON.parse(localStorage.getItem('notes') || '[]');
        
        // Projects
        function renderProjects() {
            const todo = projects.filter(p => p.status === 'todo');
            const doing = projects.filter(p => p.status === 'doing');
            const done = projects.filter(p => p.status === 'done');
            
            document.getElementById('todoList').innerHTML = todo.map(p => 
                `<div class="task" onclick="moveProject(${p.id})">${p.title}</div>`
            ).join('');
            
            document.getElementById('doingList').innerHTML = doing.map(p => 
                `<div class="task" onclick="moveProject(${p.id})">${p.title}</div>`
            ).join('');
            
            document.getElementById('doneList').innerHTML = done.map(p => 
                `<div class="task" onclick="moveProject(${p.id})">${p.title}</div>`
            ).join('');
        }
        
        function addProject() {
            const input = document.getElementById('projectInput');
            const title = input.value.trim();
            if (!title) return;
            
            projects.push({
                id: Date.now(),
                title: title,
                status: 'todo'
            });
            localStorage.setItem('projects', JSON.stringify(projects));
            input.value = '';
            renderProjects();
        }
        
        function moveProject(id) {
            const p = projects.find(x => x.id === id);
            if (p.status === 'todo') p.status = 'doing';
            else if (p.status === 'doing') p.status = 'done';
            else p.status = 'todo';
            
            localStorage.setItem('projects', JSON.stringify(projects));
            renderProjects();
        }
        
        // Notes
        function renderNotes() {
            document.getElementById('notesList').innerHTML = notes.slice(-10).reverse().map(n => 
                `<div class="note">${n.text}<div class="time">${new Date(n.time).toLocaleString()}</div></div>`
            ).join('');
        }
        
        function addNote() {
            const input = document.getElementById('noteInput');
            const text = input.value.trim();
            if (!text) return;
            
            notes.push({
                text: text,
                time: Date.now()
            });
            localStorage.setItem('notes', JSON.stringify(notes));
            input.value = '';
            renderNotes();
        }
        
        // Initial render
        renderProjects();
        renderNotes();
        loadFiles();
        
        // Load memory and research files
        async function loadFiles() {
            try {
                const r = await fetch('files.json');
                const d = await r.json();
                
                // Memory files
                document.getElementById('memoryList').innerHTML = d.memory.map(f => 
                    `<div class="note" style="cursor: pointer;" onclick="viewFile('memory/${f}')">
                        📄 ${f.replace('.md', '').replace('2026-', '')}
                    </div>`
                ).join('');
                
                // Research files
                document.getElementById('researchList').innerHTML = d.research.map(f => 
                    `<div class="note" style="cursor: pointer;" onclick="viewFile('memory/research/${f}')">
                        🔬 ${f.replace('.md', '').replace(/-/g, ' ')}
                    </div>`
                ).join('');
            } catch(e) {
                document.getElementById('memoryList').innerHTML = '<div style="color: var(--muted);">Unable to load files</div>';
                document.getElementById('researchList').innerHTML = '<div style="color: var(--muted);">Unable to load files</div>';
            }
        }
        
        function viewFile(path) {
            document.getElementById('fileModal').style.display = 'block';
            document.getElementById('fileTitle').textContent = path.split('/').pop();
            document.getElementById('fileContent').textContent = 'Loading...';
            
            fetch('/api/file/' + path)
                .then(r => r.text())
                .then(content => {
                    document.getElementById('fileContent').textContent = content;
                })
                .catch(e => {
                    document.getElementById('fileContent').textContent = 'Error loading file: ' + e.message;
                });
        }
        
        function closeFile() {
            document.getElementById('fileModal').style.display = 'none';
        }
    </script>
</body>
</html>
